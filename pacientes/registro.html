<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDICONTROL - Registro de Pacientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; }
    header { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h2 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; }
    p.desc { font-size: 0.88rem; color: #64748b; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem; }
    input, select { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    .btn { padding: 0.7rem 1.25rem; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; text-decoration: none; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 800;">MEDICONTROL • Recepción</div>
    <a href="../index.html">← Volver al Índice</a>
  </header>

  <div class="container">
    <div class="card">
      <h2>Registrar Nuevo Paciente</h2>
      <p class="desc">Caso de Uso: Registrar Paciente (Recepcionista)</p>

      <form onsubmit="event.preventDefault(); alert('¡Paciente registrado con éxito! (Simulación)');">
        <div class="grid">
          <div class="form-group">
            <label>DNI / Documento</label>
            <input type="text" placeholder="Ej: 38123456" required>
          </div>

          <div class="form-group">
            <label>Nombre</label>
            <input type="text" placeholder="Ej: María" required>
          </div>

          <div class="form-group">
            <label>Apellido</label>
            <input type="text" placeholder="Ej: González" required>
          </div>

          <div class="form-group">
            <label>Teléfono de Contacto</label>
            <input type="tel" placeholder="Ej: 342-4567890" required>
          </div>

          <div class="form-group">
            <label>Obra Social / Mutua</label>
            <input type="text" placeholder="Ej: OSDE, IAPOS, Particular...">
          </div>

          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" placeholder="ejemplo@email.com">
          </div>

          <div class="form-group full">
            <label>Dirección</label>
            <input type="text" placeholder="Ej: San Martín 1234, Santa Fe">
          </div>
        </div>

        <div class="actions">
          <a href="../index.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Registrar Paciente</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
