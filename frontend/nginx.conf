# MEDICONTROL - Nginx del contenedor frontend.
# Sirve la aplicación React compilada y reenvía /api al backend NestJS por la red interna
# de Docker. El navegador ve un solo origen, así la cookie de sesión viaja sin CORS.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # DNS interno de Docker. Con la dirección en una variable, Nginx vuelve a resolver
    # "backend" cada 10 s: si el contenedor del backend se recrea y cambia de IP, no queda
    # apuntando a la anterior (lo que daría 502 hasta reiniciar el frontend).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    # API: el nombre "backend" es el servicio de compose.yaml. Sin URI en proxy_pass, la ruta
    # llega intacta (/api/auth/login → http://backend:3000/api/auth/login).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Rutas de la aplicación (/login, /recepcion/agenda, ...): las resuelve React
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
