<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCore Health - Cancelación de Turno (Modal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #64748b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-card { background: white; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: var(--shadow-xl); overflow: hidden; padding: 2rem; text-align: center; }
    .alert-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--status-canc-bg); color: var(--status-canc-text); font-size: 1.4rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .summary-box { background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; text-align: left; margin-bottom: 1.25rem; font-size: 0.82rem; }
  </style>
</head>
<body>

  <div class="modal-card">
    <div class="alert-icon">⊗</div>
    <h2 style="font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.4rem;">¿Está seguro que desea cancelar este turno?</h2>
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.4;">Esta acción notificará al paciente y liberará el horario en la agenda.</p>

    <div class="summary-box">
      <div class="grid-2" style="margin-bottom: 0.5rem;">
        <div>
          <div style="font-size: 0.7rem; color: var(--text-light); font-weight: 700; text-transform: uppercase;">Paciente</div>
          <div style="font-weight: 700; color: var(--text-dark);">García, Roberto</div>
        </div>
        <div>
          <div style="font-size: 0.7rem; color: var(--text-light); font-weight: 700; text-transform: uppercase;">DNI</div>
          <div style="font-weight: 700; color: var(--text-dark);">24.556.788</div>
        </div>
      </div>
      <div class="grid-2">
        <div>
          <div style="font-size: 0.7rem; color: var(--text-light); font-weight: 700; text-transform: uppercase;">Médico</div>
          <div style="font-weight: 700; color: var(--text-dark);">Dra. Elena Martínez</div>
        </div>
        <div>
          <div style="font-size: 0.7rem; color: var(--text-light); font-weight: 700; text-transform: uppercase;">Fecha y Hora</div>
          <div style="font-weight: 700; color: var(--text-dark);">24 Oct, 2023 - 09:00 AM</div>
        </div>
      </div>
    </div>

    <form onsubmit="event.preventDefault(); alert('Turno cancelado.'); window.location.href='03-recepcion-dashboard.html';">
      <div class="form-group" style="text-align:left;">
        <label>Motivo de Cancelación</label>
        <select class="input-box" required>
          <option value="">Seleccione un motivo...</option>
          <option>Aviso previo del paciente</option>
          <option>Ausencia del profesional</option>
          <option>Emergencia médica</option>
        </select>
      </div>

      <div class="form-group" style="text-align:left;">
        <label>Comentarios adicionales (Opcional)</label>
        <textarea class="input-box" rows="2" placeholder="Escriba detalles adicionales si es necesario..." style="resize:none;"></textarea>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="03-recepcion-dashboard.html" class="btn btn-secondary" style="flex:1;">Volver</a>
        <button type="submit" class="btn btn-danger" style="flex:1;">Confirmar Cancelación</button>
      </div>
    </form>
  </div>

</body>
</html>
