<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDICONTROL - Modificar Turno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; }
    header { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .container { max-width: 750px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h2 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; }
    p.desc { font-size: 0.88rem; color: #64748b; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem; }
    input, select { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .patient-box { background: #f1f5f9; padding: 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem; }
    .actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    .btn { padding: 0.7rem 1.25rem; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; text-decoration: none; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 800;">MEDICONTROL • Recepción</div>
    <a href="consultar.html">← Volver a la Lista</a>
  </header>

  <div class="container">
    <div class="card">
      <h2>Modificar Turno Existente (#101)</h2>
      <p class="desc">Caso de Uso: Modificar Turno (Recepcionista)</p>

      <div class="patient-box">
        <strong>Paciente actual:</strong> Juan Pérez (DNI: 35.123.456)<br>
        <strong>Turno actual:</strong> 14/08/2026 a las 08:30 hs con Dr. Roberto Gómez (Cardiología)
      </div>

      <form onsubmit="event.preventDefault(); alert('¡Turno modificado correctamente! (Simulación)'); window.location.href='consultar.html';">
        <div class="grid">
          <div class="form-group">
            <label>Médico Asignado</label>
            <select>
              <option selected>Dr. Roberto Gómez (Cardiología)</option>
              <option>Dra. María Fernández (Pediatría)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Nueva Fecha</label>
            <input type="date" value="2026-08-18">
          </div>

          <div class="form-group">
            <label>Nuevo Horario Disponible</label>
            <select>
              <option>09:00 hs</option>
              <option selected>09:30 hs</option>
              <option>10:00 hs</option>
            </select>
          </div>

          <div class="form-group">
            <label>Estado del Turno</label>
            <select>
              <option selected>Confirmado</option>
              <option>Reagendado</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <a href="consultar.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
